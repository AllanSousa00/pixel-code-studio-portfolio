<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080809" />
    <meta name="description" content="Pixel Code Studio — sites, plataformas, bots e experiências digitais criadas por Allan Sousa." />
    <meta property="og:title" content="Pixel Code Studio — Portfólio" />
    <meta property="og:description" content="Projetos reais, interfaces marcantes e soluções digitais sob medida." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pixel-code-studio-portfolio.pages.dev/" />
    <meta property="og:image" content="https://pixel-code-studio-portfolio.pages.dev/projects/vertice-enem.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const savedTheme = localStorage.getItem('pixel-code-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {}
    </script>
    <title>Pixel Code Studio — Portfólio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
